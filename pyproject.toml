[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomington-rag"
version = "0.2.0"
requires-python = ">=3.11"

[project.optional-dependencies]
eval = [
  "PyYAML==6.0.3",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evals/tests"]
